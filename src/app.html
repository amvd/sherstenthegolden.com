<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicons & App Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-48x48.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- Essential SEO & Social Sharing Defaults -->
		<title>Shersten the Golden</title>
		<meta
			name="description"
			content="Fantasy cosplayer, prop maker, and themed model bringing legendary characters to life."
		/>
		<meta name="author" content="Shersten the Golden" />
		<link rel="canonical" href="https://sherstenthegolden.com/" />

		<!-- OpenGraph / Facebook / Instagram / LinkedIn / Pinterest Preview Tags -->
		<meta property="og:site_name" content="Shersten the Golden" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://sherstenthegolden.com/" />
		<meta property="og:title" content="Shersten the Golden | Fantasy Cosplayer & Model" />
		<meta
			property="og:description"
			content="Fantasy cosplayer, prop maker, and themed model bringing legendary characters to life."
		/>
		<meta property="og:image" content="https://sherstenthegolden.com/og-image.jpg" />
		<meta property="og:image:secure_url" content="https://sherstenthegolden.com/og-image.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Shersten the Golden - Fantasy Cosplayer & Artisan" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter Card Preview Tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://sherstenthegolden.com/" />
		<meta name="twitter:title" content="Shersten the Golden | Fantasy Cosplayer & Model" />
		<meta
			name="twitter:description"
			content="Fantasy cosplayer, prop maker, and themed model bringing legendary characters to life."
		/>
		<meta name="twitter:image" content="https://sherstenthegolden.com/og-image.jpg" />
		<meta name="twitter:image:alt" content="Shersten the Golden - Fantasy Cosplayer & Artisan" />

		<!-- Pinterest Rich Pins & Sharing Metadata -->
		<meta name="pinterest-rich-pin" content="true" />
		<meta name="pinterest:card" content="summary_large_image" />
		<meta name="pinterest:title" content="Shersten the Golden | Fantasy Cosplay & Costume Design" />
		<meta
			name="pinterest:description"
			content="Fantasy cosplayer, prop maker, and themed model bringing legendary characters to life."
		/>
		<meta name="pinterest:image" content="https://sherstenthegolden.com/og-image.jpg" />

		<!-- JSON-LD Structured Data Schema for Search Engines & Social Graph Crawlers -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Shersten the Golden",
				"url": "https://sherstenthegolden.com",
				"image": "https://sherstenthegolden.com/og-image.jpg",
				"description": "Fantasy cosplayer, prop maker, and themed model bringing legendary characters to life.",
				"sameAs": [
					"https://instagram.com/shersten.the.golden",
					"https://www.tiktok.com/@shersten.the.golden"
				],
				"jobTitle": "Cosplayer & Prop Artisan"
			}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
		<link rel="dns-prefetch" href="https://fonts.gstatic.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Fondamento:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap&subset=latin"
			rel="stylesheet"
		/>
		<script
			data-goatcounter="https://amvd.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
